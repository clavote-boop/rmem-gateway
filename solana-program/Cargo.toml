[package]
name = "rmem-solana-registry"
version = "0.3.4"
edition = "2021"
description = "Solana program mirroring RmemMemoryRegistry: ERC-8264 memory ops + body lease with explicit revoked_at."
license = "CC0-1.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "~2.0"
borsh = "1.5"

[profile.release]
overflow-checks = true
opt-level = "z"        # size-optimized (BPF doesn't care about CPU speed; cycles ≠ bytes)
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
