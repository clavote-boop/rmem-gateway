[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = []

[rpc_endpoints]
sepolia       = "${SEPOLIA_RPC_URL}"
base_sepolia  = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia      = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
